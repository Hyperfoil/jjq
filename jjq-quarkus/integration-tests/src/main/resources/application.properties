# Exercise the opt-in setting through the CDI mapper and both REST readers.
quarkus.jjq.fail-on-unknown-properties=true
# Exercise direct byte-to-record readers on every eligible request type
# (issue #170): inputs outside the canonical fast path fall back to the
# same strict parse-plus-map path, so all assertions below pin parity.
quarkus.jjq.direct-readers=true
# Use an ephemeral port for in-process and packaged tests.
quarkus.http.test-port=0
quarkus.http.limits.max-body-size=32K
